- type: entity
  abstract: true
  parent: BaseSignWeak
  id: PosterBase
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/posters.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: Construction
    graph: PosterGraph
    node: start

- type: entity
  parent: BaseSignWeak
  id: PosterBroken
  name: broken poster
  description: "ポスターの原版からは何も読み取れない。完全にダメになっている。"
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Wallmounts/posters.rsi
    state: poster_broken
  - type: Construction
    graph: PosterGraph
    node: tornPoster

