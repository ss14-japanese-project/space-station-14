- type: entity
  abstract: true
  parent: BaseSignWeak
  id: BaseFlag
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/flags.rsi
  - type: Damageable
    damageModifierSet: ThreadMod

- type: entity
  parent: BaseFlag
  id: BlankFlag
  name: 空白の旗
  description: 白い布切れ。フランス国旗ではないことは確かだ。
  components:
  - type: Sprite
    state: blank_flag

- type: entity
  parent: BaseFlag
  id: NTFlag
  name: Nanotrasenの旗
  description: Nanotrasenに栄光あれ！待って、本当に企業のために旗を作ったの？
  components:
  - type: Sprite
    state: NT_flag

- type: entity
  parent: BaseFlag
  id: SyndieFlag
  name: シンジケートの旗
  description: 血の臭いがする。Nanotrasenに死を！
  components:
  - type: Sprite
    state: syndie_flag

- type: entity
  parent: BaseFlag
  id: LGBTQFlag
  name: LGBTQの旗
  description: 「Be gay do crime」と書かれた旗。
  components:
  - type: Sprite
    state: lgbtq_flag

- type: entity
  parent: BaseFlag
  id: PirateFlag
  name: 海賊旗
  description: 海賊旗を掲げろ！
  components:
  - type: Sprite
    state: pirate_flag
